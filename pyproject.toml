[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxrpy"
dynamic = ["version"]
description = "Python wrapper for the Oxford Response private server API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "BLK-TTAUDI" }]
keywords = ["oxford response", "oxford roleplay", "roblox", "api", "wrapper"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
async = ["httpx>=0.24"]
test = ["pytest>=7", "httpx>=0.24"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "httpx>=0.24"]

[project.scripts]
oxrpy = "oxrpy.__main__:main"

[project.urls]
Homepage = "https://github.com/BLK-TTAUDI/OXRPY"
Repository = "https://github.com/BLK-TTAUDI/OXRPY"
Documentation = "https://docs.oxfd.re/"
Changelog = "https://github.com/BLK-TTAUDI/OXRPY/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["oxrpy"]

[tool.setuptools.dynamic]
version = { attr = "oxrpy.__version__" }

[tool.setuptools.package-data]
oxrpy = ["py.typed", "*.pyi"]
