site_name: oxrpy
site_description: Python wrapper for the Oxford Response private server API
# Set this to the docs domain once it's live, e.g. https://docs.example.com/
# site_url: https://example.com/
repo_url: https://github.com/BLK-TTAUDI/OXRPY
repo_name: BLK-TTAUDI/OXRPY
edit_uri: ""
copyright: Copyright &copy; BLK-TTAUDI

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Guide:
      - Reading data: guide/reading-data.md
      - Events and logs: guide/events.md
      - Commands: guide/commands.md
      - Async and Discord bots: guide/async.md
      - Many servers and app keys: guide/many-servers.md
      - Maps and positions: guide/map.md
      - Rate limits and errors: guide/limits-and-errors.md
      - Command line: guide/cli.md
  - Examples: examples.md
  - Reference:
      - OxfordAPI: reference/client.md
      - AsyncOxfordAPI: reference/async.md
      - AsyncServerPool: reference/pool.md
      - Following and saving position: reference/following.md
      - Command helpers: reference/commands.md
      - Data types: reference/types.md
      - Staff and group sync: reference/sync.md
      - Map helpers: reference/map.md
      - Errors: reference/errors.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: false
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            heading_level: 2
